name: Review or deploy private pilot

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Generate the pilot diff first; deploy only after that exact revision is reviewed
        required: true
        default: diff
        type: choice
        options:
          - diff
          - deploy
          - recover-failed-create
          - request-recipient-verification
          - cleanup-restore-rehearsal
          - restore-rehearsal
          - alarm-rehearsal
      hosted_zone_id:
        description: Existing saystay.site Route 53 hosted zone ID, or CURRENT for an existing-stack update
        required: true
        type: string
      reviewed_commit:
        description: Exact 40-character main commit reviewed for deployment (required for deploy)
        required: false
        type: string
      confirm_reviewed_diff:
        description: Confirm the same commit's pilot diff and cost review were completed
        required: true
        default: false
        type: boolean
      recipient_slot:
        description: Private repository-secret slot used for an SES sandbox verification request
        required: false
        default: a
        type: choice
        options:
          - a
          - b
      restore_table_name:
        description: Exact temporary restore table to clean after a failed rehearsal
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: stay-pilot-deployment
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_APP_URL: https://pilot.saystay.site
    steps:
      - uses: actions/checkout@v7
      - name: Confirm exact main-branch source
        env:
          OPERATION: ${{ inputs.operation }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          CONFIRM_REVIEWED_DIFF: ${{ inputs.confirm_reviewed_diff }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          if [ "$OPERATION" != 'diff' ]; then
            test "$CONFIRM_REVIEWED_DIFF" = 'true'
            test "$REVIEWED_COMMIT" = "$GITHUB_SHA"
            printf '%s' "$REVIEWED_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          fi
      - name: Confirm scoped GitHub OIDC claims
        run: |
          node <<'NODE'
          const response = await fetch(
            `${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com`,
            { headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } },
          );
          if (!response.ok) throw new Error(`OIDC token request failed: ${response.status}`);
          const { value } = await response.json();
          const payload = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
          console.log(JSON.stringify({ iss: payload.iss, aud: payload.aud, sub: payload.sub }));
          if (payload.aud !== 'sts.amazonaws.com') throw new Error('Unexpected OIDC audience');
          if (payload.sub !== 'repo:AmirmLotfy@178108135/stay@1354119197:ref:refs/heads/main')
            throw new Error('Unexpected OIDC subject');
          NODE
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
      - name: Activate pinned pnpm
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm cdk:synth:pilot
      - name: Record candidate template and source
        run: |
          template_sha="$(sha256sum infrastructure/cdk/cdk.out/StayPilotStack.template.json | cut -d ' ' -f 1)"
          change_set_name="stay-pilot-review-$GITHUB_SHA"
          {
            printf '### STAY pilot candidate\n\n'
            printf -- "- Source: \`%s\`\n" "$GITHUB_SHA"
            printf -- "- Template SHA-256: \`%s\`\n" "$template_sha"
            printf -- "- Change set: \`%s\`\n" "$change_set_name"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'PILOT_CHANGE_SET_NAME=%s\n' "$change_set_name" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Confirm non-root deployment identity
        run: |
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          test "${arn##*:}" != 'root'
          printf 'Deploying through scoped role: %s\n' "$arn"
      - name: Resolve existing pilot deployment parameters
        if: inputs.operation == 'diff' || inputs.operation == 'deploy'
        env:
          REQUESTED_HOSTED_ZONE_ID: ${{ inputs.hosted_zone_id }}
        run: |
          hosted_zone_id="$REQUESTED_HOSTED_ZONE_ID"
          if [ "$hosted_zone_id" = 'CURRENT' ]; then
            hosted_zone_id="$(aws cloudformation describe-stacks --stack-name StayPilotStack \
              --query "Stacks[0].Parameters[?ParameterKey=='ExistingHostedZoneId'].ParameterValue | [0]" \
              --output text)"
          fi
          printf '%s' "$hosted_zone_id" | grep -Eq '^Z[A-Z0-9]+$'
          printf 'HOSTED_ZONE_ID=%s\n' "$hosted_zone_id" >> "$GITHUB_ENV"
      - name: Assume bootstrap deployment role for controlled provider action
        if: inputs.operation == 'recover-failed-create' && inputs.confirm_reviewed_diff == true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::828547077857:role/cdk-hnb659fds-deploy-role-828547077857-us-east-1
          aws-region: us-east-1
          role-chaining: true
      - name: Request private SES recipient verification
        if: inputs.operation == 'request-recipient-verification' && inputs.confirm_reviewed_diff == true
        env:
          RECIPIENT_SLOT: ${{ inputs.recipient_slot }}
          RECIPIENT_A: ${{ secrets.STAY_PILOT_RECIPIENT_A }}
          RECIPIENT_B: ${{ secrets.STAY_PILOT_RECIPIENT_B }}
        run: |
          case "$RECIPIENT_SLOT" in
            a) recipient="$RECIPIENT_A" ;;
            b) recipient="$RECIPIENT_B" ;;
            *) printf 'Unknown private recipient slot.\n' >&2; exit 1 ;;
          esac
          test -n "$recipient"
          RECIPIENT="$recipient" node <<'NODE'
          const email = process.env.RECIPIENT ?? '';
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))
            throw new Error('Private recipient secret is not an email address.');
          if (!email.toLowerCase().includes('+stay-pilot-'))
            throw new Error('Private recipient must use a dedicated STAY pilot alias.');
          NODE

          identity_file="$RUNNER_TEMP/ses-recipient-identity.json"
          error_file="$RUNNER_TEMP/ses-recipient-error.txt"
          if aws sesv2 get-email-identity --email-identity "$recipient" > "$identity_file" 2> "$error_file"; then
            verified="$(node -p "String(require(process.argv[1]).VerifiedForSendingStatus === true)" "$identity_file")"
            state="$([ "$verified" = 'true' ] && printf verified || printf pending)"
          elif grep -Fq 'NotFoundException' "$error_file"; then
            if ! aws sesv2 create-email-identity --email-identity "$recipient" > "$identity_file" 2> /dev/null; then
              printf 'SES verification request failed for private slot %s.\n' "$RECIPIENT_SLOT" >&2
              exit 1
            fi
            state=requested
          else
            printf 'SES identity lookup failed for private slot %s.\n' "$RECIPIENT_SLOT" >&2
            exit 1
          fi
          identity_hash="$(printf '%s' "$recipient" | sha256sum | cut -d ' ' -f 1)"
          {
            printf '### SES pilot recipient verification\n\n'
            printf -- '- Private slot: %s\n' "$RECIPIENT_SLOT"
            printf -- '- Identity SHA-256: %s\n' "$identity_hash"
            printf -- '- State: %s\n' "$state"
            printf -- '- No address or application email was printed or sent.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Recover failed pilot create
        if: inputs.operation == 'recover-failed-create' && inputs.confirm_reviewed_diff == true
        run: |
          set +e
          describe_output="$(aws cloudformation describe-stacks --stack-name StayPilotStack \
            --query 'Stacks[0].StackStatus' --output text 2>&1)"
          describe_code=$?
          set -e
          if [ "$describe_code" -ne 0 ]; then
            printf '%s' "$describe_output" | grep -Fq 'does not exist'
            {
              printf '### Failed pilot create already recovered\n\n'
              printf -- "- No CloudFormation stack named \`StayPilotStack\` remains.\n"
              printf -- '- The recovery operation is idempotently complete; retained-resource cleanup is handled separately.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status="$describe_output"
          test "$status" = 'ROLLBACK_FAILED'

          bucket_status="$(aws cloudformation describe-stack-resource \
            --stack-name StayPilotStack \
            --logical-resource-id WebsiteBucket75C24D94 \
            --query 'StackResourceDetail.ResourceStatus' --output text)"
          user_pool_status="$(aws cloudformation describe-stack-resource \
            --stack-name StayPilotStack \
            --logical-resource-id UserPool6BA7E5F2 \
            --query 'StackResourceDetail.ResourceStatus' --output text)"
          test "$bucket_status" = 'DELETE_FAILED'
          test "$user_pool_status" = 'DELETE_FAILED'

          bucket_id="$(aws cloudformation describe-stack-resource \
            --stack-name StayPilotStack \
            --logical-resource-id WebsiteBucket75C24D94 \
            --query 'StackResourceDetail.PhysicalResourceId' --output text)"
          user_pool_id="$(aws cloudformation describe-stack-resource \
            --stack-name StayPilotStack \
            --logical-resource-id UserPool6BA7E5F2 \
            --query 'StackResourceDetail.PhysicalResourceId' --output text)"

          aws cloudformation update-termination-protection \
            --stack-name StayPilotStack \
            --no-enable-termination-protection

          # CloudFormation accepts --retain-resources only after a delete has
          # reached DELETE_FAILED, so make the guarded first attempt and then
          # retain only the two resources already proven unable to roll back.
          aws cloudformation delete-stack --stack-name StayPilotStack
          if aws cloudformation wait stack-delete-complete --stack-name StayPilotStack; then
            aws cognito-idp describe-user-pool --user-pool-id "$user_pool_id" >/dev/null
            aws s3api head-bucket --bucket "$bucket_id"
            {
              printf '### Failed pilot create recovered\n\n'
              printf -- "- Removed failed stack: \`StayPilotStack\`\n"
              printf -- "- Retained empty user pool through its template policy: \`%s\`\n" "$user_pool_id"
              printf -- "- Retained generated website bucket through its template policy: \`%s\`\n" "$bucket_id"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          delete_status="$(aws cloudformation describe-stacks --stack-name StayPilotStack \
            --query 'Stacks[0].StackStatus' --output text)"
          test "$delete_status" = 'DELETE_FAILED'
          failed_resources="$(aws cloudformation describe-stack-resources \
            --stack-name StayPilotStack \
            --query "StackResources[?ResourceStatus==\`DELETE_FAILED\`].LogicalResourceId" \
            --output text | tr '\t' '\n' | sort | paste -sd, -)"
          test "$failed_resources" = 'UserPool6BA7E5F2,WebsiteBucket75C24D94'
          aws cloudformation delete-stack \
            --stack-name StayPilotStack \
            --retain-resources WebsiteBucket75C24D94 UserPool6BA7E5F2
          aws cloudformation wait stack-delete-complete --stack-name StayPilotStack

          {
            printf '### Failed pilot create recovered\n\n'
            printf -- "- Removed failed stack: \`StayPilotStack\`\n"
            printf -- "- Retained empty user pool for controlled cleanup: \`%s\`\n" "$user_pool_id"
            printf -- "- Retained generated website bucket for controlled cleanup: \`%s\`\n" "$bucket_id"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Rehearse isolated point-in-time recovery
        if: inputs.operation == 'restore-rehearsal' && inputs.confirm_reviewed_diff == true
        run: |
          set -euo pipefail
          source_table="$(aws cloudformation describe-stacks --stack-name StayPilotStack \
            --query "Stacks[0].Outputs[?OutputKey=='ProductTableName'].OutputValue | [0]" --output text)"
          test -n "$source_table"
          test "$source_table" != 'None'
          recovery_state="$(aws dynamodb describe-continuous-backups --table-name "$source_table" \
            --query 'ContinuousBackupsDescription.PointInTimeRecoveryDescription.PointInTimeRecoveryStatus' \
            --output text)"
          test "$recovery_state" = 'ENABLED'
          aws dynamodb update-item --table-name "$source_table" \
            --key '{"PK":{"S":"CONTROL#PILOT"},"SK":{"S":"ENROLLMENT"}}' \
            --update-expression 'SET paused = :paused' \
            --expression-attribute-values '{":paused":{"BOOL":true}}' >/dev/null
          paused="$(aws dynamodb get-item --table-name "$source_table" \
            --key '{"PK":{"S":"CONTROL#PILOT"},"SK":{"S":"ENROLLMENT"}}' \
            --consistent-read --projection-expression paused --query 'Item.paused.BOOL' --output text)"
          test "$paused" = 'True'

          target_table="stay-pilot-restore-rehearsal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$target_table" in
            stay-pilot-restore-rehearsal-*) ;;
            *) printf 'Unsafe restore target.\n' >&2; exit 1 ;;
          esac
          started_at="$(date +%s)"
          wait_until_active() {
            local table_name="$1"
            local deadline="$((SECONDS + 1500))"
            local status=''
            while [ "$SECONDS" -lt "$deadline" ]; do
              status="$(aws dynamodb describe-table --table-name "$table_name" \
                --query 'Table.TableStatus' --output text 2>/dev/null)" || status='NOT_FOUND'
              case "$status" in
                ACTIVE) return 0 ;;
                CREATING|UPDATING|RESTORING|NOT_FOUND) sleep 15 ;;
                *) printf 'Restore table entered terminal status: %s\n' "$status" >&2; return 1 ;;
              esac
            done
            printf 'Restore table did not become active within 25 minutes.\n' >&2
            return 1
          }
          cleanup_restore() {
            local cleanup_status=''
            case "$target_table" in
              stay-pilot-restore-rehearsal-*) ;;
              *) return 1 ;;
            esac
            if ! aws dynamodb describe-table --table-name "$target_table" >/dev/null 2>&1; then
              return 0
            fi
            if ! wait_until_active "$target_table"; then
              return 1
            fi
            if aws dynamodb describe-table --table-name "$target_table" >/dev/null 2>&1; then
              protected="$(aws dynamodb describe-table --table-name "$target_table" \
                --query 'Table.DeletionProtectionEnabled' --output text 2>/dev/null)"
              if [ "$protected" = 'True' ]; then
                aws dynamodb update-table --table-name "$target_table" \
                  --no-deletion-protection-enabled >/dev/null
                wait_until_active "$target_table"
              fi
              aws dynamodb delete-table --table-name "$target_table" >/dev/null
              cleanup_deadline="$((SECONDS + 900))"
              while [ "$SECONDS" -lt "$cleanup_deadline" ]; do
                cleanup_status="$(aws dynamodb describe-table --table-name "$target_table" \
                  --query 'Table.TableStatus' --output text 2>/dev/null)" || return 0
                case "$cleanup_status" in
                  DELETING) sleep 15 ;;
                  *) printf 'Restore cleanup entered unexpected status: %s\n' "$cleanup_status" >&2; return 1 ;;
                esac
              done
              printf 'Restore table was not deleted within 15 minutes.\n' >&2
              return 1
            fi
          }
          trap 'cleanup_restore || true' EXIT

          aws dynamodb restore-table-to-point-in-time \
            --source-table-name "$source_table" \
            --target-table-name "$target_table" \
            --use-latest-restorable-time \
            --billing-mode-override PAY_PER_REQUEST >/dev/null
          wait_until_active "$target_table"

          target_metadata="$RUNNER_TEMP/pilot-restored-table-metadata.json"
          aws dynamodb describe-table --table-name "$target_table" > "$target_metadata"
          TARGET_METADATA="$target_metadata" node <<'NODE'
          const fs = require('node:fs');
          const metadata = JSON.parse(fs.readFileSync(process.env.TARGET_METADATA, 'utf8'));
          const table = metadata.Table ?? {};
          const streamEnabled = table.StreamSpecification?.StreamEnabled === true;
          console.log(JSON.stringify({
            restoredTableStatus: table.TableStatus,
            streamEnabled,
          }));
          if (table.TableStatus !== 'ACTIVE')
            throw new Error('Restored table was not active before validation.');
          if (streamEnabled)
            throw new Error('Restored table unexpectedly has an active DynamoDB stream.');
          NODE
          managed_table="$(aws cloudformation describe-stack-resource --stack-name StayPilotStack \
            --logical-resource-id ProductTableB8D4E9ED \
            --query 'StackResourceDetail.PhysicalResourceId' --output text)"
          if [ "$managed_table" != "$source_table" ]; then
            printf 'CloudFormation product table does not match the stack output used for recovery.\n' >&2
            exit 1
          fi
          if [ "$target_table" = "$managed_table" ]; then
            printf 'Recovery target unexpectedly matches the managed source table.\n' >&2
            exit 1
          fi
          printf 'Restore metadata verified: managed source matched, isolated target distinct, stream enabled=false.\n'

          source_file="$RUNNER_TEMP/pilot-source-scan.json"
          restored_file="$RUNNER_TEMP/pilot-restored-scan.json"
          reconciled_file="$RUNNER_TEMP/pilot-reconciled-scan.json"
          aws dynamodb scan --table-name "$source_table" --consistent-read --output json > "$source_file"
          aws dynamodb scan --table-name "$target_table" --consistent-read --output json > "$restored_file"

          SOURCE_FILE="$source_file" RESTORED_FILE="$restored_file" TARGET_TABLE="$target_table" node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const source = JSON.parse(fs.readFileSync(process.env.SOURCE_FILE, 'utf8')).Items ?? [];
          const restored = JSON.parse(fs.readFileSync(process.env.RESTORED_FILE, 'utf8')).Items ?? [];
          const scalar = (value) => value?.S ?? value?.N ?? value?.BOOL;
          const key = (item) => `${scalar(item.PK)}\u0000${scalar(item.SK)}`;
          const restoredKeys = new Set(restored.map(key));
          const securityState = source.filter((item) => {
            const sk = String(scalar(item.SK) ?? '');
            return (
              (sk.startsWith('MEMBERSHIP#') && scalar(item.active) === false) ||
              (sk.startsWith('NOTIFICATION_CONTACT#') && scalar(item.enabled) === false) ||
              (sk.startsWith('PROFILE#') && scalar(item.status) === 'closed') ||
              sk.startsWith('TOMBSTONE#')
            );
          });
          for (const item of securityState) {
            const request = JSON.stringify({ TableName: process.env.TARGET_TABLE, Item: item });
            const result = spawnSync('aws', ['dynamodb', 'put-item', '--cli-input-json', request], {
              encoding: 'utf8',
            });
            if (result.status !== 0) throw new Error('Failed to reapply a private revocation/deletion state.');
            restoredKeys.add(key(item));
          }
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `- Restored records before reconciliation: \`${restored.length}\`\n` +
              `- Current source records: \`${source.length}\`\n` +
              `- Revocation/deletion states reapplied: \`${securityState.length}\`\n`,
          );
          console.log(JSON.stringify({
            restoredRecords: restored.length,
            sourceRecords: source.length,
            securityStatesReapplied: securityState.length,
          }));
          NODE

          aws dynamodb scan --table-name "$target_table" --consistent-read --output json > "$reconciled_file"
          SOURCE_FILE="$source_file" RESTORED_FILE="$reconciled_file" node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync(process.env.SOURCE_FILE, 'utf8')).Items ?? [];
          const restored = JSON.parse(fs.readFileSync(process.env.RESTORED_FILE, 'utf8')).Items ?? [];
          const scalar = (value) => value?.S ?? value?.N ?? value?.BOOL;
          const key = (item) => `${scalar(item.PK)}\u0000${scalar(item.SK)}`;
          const restoredByKey = new Map(restored.map((item) => [key(item), item]));
          const canonical = (value) => {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === 'object')
              return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]));
            return value;
          };
          const exactPrefixes = ['ACCESS#', 'MEMBERSHIP#', 'NOTIFICATION_CONTACT#', 'PRIVACY#', 'PROFILE#'];
          const relevant = source.filter((item) => exactPrefixes.some((prefix) =>
            String(scalar(item.SK) ?? '').startsWith(prefix),
          ));
          for (const item of relevant) {
            const restoredItem = restoredByKey.get(key(item));
            if (!restoredItem || JSON.stringify(canonical(restoredItem)) !== JSON.stringify(canonical(item)))
              throw new Error('Restored access, privacy, profile, or membership state differs from current state.');
          }
          const sent = restored.filter((item) =>
            String(scalar(item.SK) ?? '').startsWith('DELIVERY#') && scalar(item.status) === 'sent',
          ).length;
          const revokedMemberships = restored.filter((item) =>
            String(scalar(item.SK) ?? '').startsWith('MEMBERSHIP#') && scalar(item.active) === false,
          ).length;
          if (revokedMemberships < 1) throw new Error('Expected synthetic revoked membership is missing.');
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `- Exact access/profile/privacy/membership records verified: \`${relevant.length}\`\n` +
              `- Revoked memberships retained: \`${revokedMemberships}\`\n` +
              `- Sent delivery markers retained with no active stream: \`${sent}\`\n`,
          );
          console.log(JSON.stringify({
            exactSecurityRecordsVerified: relevant.length,
            revokedMemberships,
            sentDeliveryMarkers: sent,
          }));
          NODE

          completed_at="$(date +%s)"
          elapsed_seconds="$((completed_at - started_at))"
          cleanup_restore
          trap - EXIT
          if aws dynamodb describe-table --table-name "$target_table" >/dev/null 2>&1; then
            printf 'Temporary restored table still exists after cleanup.\n' >&2
            exit 1
          fi
          {
            printf '### Isolated DynamoDB recovery rehearsal\n\n'
            printf -- '- PITR status: `ENABLED`\n'
            printf -- '- Restored table remained outside CloudFormation and had no active stream.\n'
            printf -- '- RTO measured through validation: `%s seconds`\n' "$elapsed_seconds"
            printf -- '- Temporary restored table cleanup: confirmed.\n'
            printf -- '- Enrollment control left paused: `true`\n'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'Recovery rehearsal passed: RTO=%ss, cleanup=confirmed, enrollment_paused=true.\n' \
            "$elapsed_seconds"
      - name: Clean a failed isolated restore
        if: inputs.operation == 'cleanup-restore-rehearsal' && inputs.confirm_reviewed_diff == true
        env:
          RESTORE_TABLE_NAME: ${{ inputs.restore_table_name }}
        run: |
          set -euo pipefail
          printf '%s' "$RESTORE_TABLE_NAME" | grep -Eq '^stay-pilot-restore-rehearsal-[0-9]+-[0-9]+$'
          if ! aws dynamodb describe-table --table-name "$RESTORE_TABLE_NAME" >/dev/null 2>&1; then
            printf 'Temporary restore table is already absent.\n'
          else
            deadline="$((SECONDS + 1500))"
            while [ "$SECONDS" -lt "$deadline" ]; do
              status="$(aws dynamodb describe-table --table-name "$RESTORE_TABLE_NAME" \
                --query 'Table.TableStatus' --output text)"
              case "$status" in
                ACTIVE) break ;;
                CREATING|UPDATING|RESTORING) sleep 15 ;;
                *) printf 'Restore table entered terminal status: %s\n' "$status" >&2; exit 1 ;;
              esac
            done
            test "$status" = 'ACTIVE'
            protected="$(aws dynamodb describe-table --table-name "$RESTORE_TABLE_NAME" \
              --query 'Table.DeletionProtectionEnabled' --output text)"
            if [ "$protected" = 'True' ]; then
              aws dynamodb update-table --table-name "$RESTORE_TABLE_NAME" \
                --no-deletion-protection-enabled >/dev/null
              update_deadline="$((SECONDS + 300))"
              while [ "$SECONDS" -lt "$update_deadline" ]; do
                status="$(aws dynamodb describe-table --table-name "$RESTORE_TABLE_NAME" \
                  --query 'Table.TableStatus' --output text)"
                [ "$status" = 'ACTIVE' ] && break
                sleep 15
              done
              test "$status" = 'ACTIVE'
            fi
            aws dynamodb delete-table --table-name "$RESTORE_TABLE_NAME" >/dev/null
            cleanup_deadline="$((SECONDS + 900))"
            while [ "$SECONDS" -lt "$cleanup_deadline" ]; do
              if ! aws dynamodb describe-table --table-name "$RESTORE_TABLE_NAME" >/dev/null 2>&1; then
                break
              fi
              sleep 15
            done
            if aws dynamodb describe-table --table-name "$RESTORE_TABLE_NAME" >/dev/null 2>&1; then
              printf 'Temporary restore table cleanup timed out.\n' >&2
              exit 1
            fi
          fi
          {
            printf '### Failed restore cleanup\n\n'
            printf -- '- Exact temporary table cleanup: confirmed.\n'
            printf -- '- Enrollment control remains paused.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise owner alarm subscription
        if: inputs.operation == 'alarm-rehearsal' && inputs.confirm_reviewed_diff == true
        run: |
          set -euo pipefail
          alarm_name="$(aws cloudformation describe-stack-resource --stack-name StayPilotStack \
            --logical-resource-id ApiErrorAlarmD3E841A2 \
            --query 'StackResourceDetail.PhysicalResourceId' --output text)"
          test -n "$alarm_name"
          prior_state="$(aws cloudwatch describe-alarms --alarm-names "$alarm_name" \
            --query 'MetricAlarms[0].StateValue' --output text)"
          case "$prior_state" in
            OK|INSUFFICIENT_DATA) ;;
            *) printf 'Pilot API alarm is already in ALARM; refusing to mask it.\n' >&2; exit 1 ;;
          esac
          aws cloudwatch set-alarm-state --alarm-name "$alarm_name" --state-value ALARM \
            --state-reason "STAY pilot owner subscription rehearsal ${GITHUB_RUN_ID}"
          sleep 15
          aws cloudwatch set-alarm-state --alarm-name "$alarm_name" --state-value "$prior_state" \
            --state-reason "STAY pilot owner subscription rehearsal complete ${GITHUB_RUN_ID}"
          {
            printf '### Owner alarm subscription rehearsal\n\n'
            printf -- '- Exercised the deployed pilot API alarm through `ALARM` and restored its prior state.\n'
            printf -- '- Rehearsal run: `%s`\n' "$GITHUB_RUN_ID"
            printf -- '- Owner inbox receipt remains a separate human-visible check.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate deployment parameters
        if: inputs.operation == 'diff' || inputs.operation == 'deploy'
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
        run: |
          printf '%s' "$HOSTED_ZONE_ID" | grep -Eq '^Z[A-Z0-9]+$'
          test -n "$ALERT_EMAIL"
          test -n "$SES_FROM_EMAIL"
      - name: Generate pilot template diff
        if: inputs.operation == 'diff'
        run: |
          pnpm --filter @stay/infra exec cdk diff StayPilotStack \
            --strict \
            -c stage=pilot \
            -c enableCloudFront=false \
            -c enableCustomDomain=true \
            -c enableDeletionProtection=true \
            --method template
      - name: Prepare exact non-executed pilot change set
        if: inputs.operation == 'diff'
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
        run: |
          pnpm --filter @stay/infra exec cdk deploy StayPilotStack \
            --strict \
            -c stage=pilot \
            -c enableCloudFront=false \
            -c enableCustomDomain=true \
            -c enableDeletionProtection=true \
            --parameters "StayPilotStack:ExistingHostedZoneId=$HOSTED_ZONE_ID" \
            --parameters "StayPilotStack:AlertEmail=$ALERT_EMAIL" \
            --parameters "StayPilotStack:SesFromEmail=$SES_FROM_EMAIL" \
            --parameters "StayPilotStack:BedrockModelId=" \
            --method prepare-change-set \
            --change-set-name "$PILOT_CHANGE_SET_NAME" \
            --require-approval never
      - name: Record exact pilot change set
        if: inputs.operation == 'diff'
        run: |
          change_set_file="$RUNNER_TEMP/pilot-change-set.json"
          aws cloudformation describe-change-set \
            --stack-name StayPilotStack \
            --change-set-name "$PILOT_CHANGE_SET_NAME" \
            --query '{ChangeSetName:ChangeSetName,StackId:StackId,StackName:StackName,Status:Status,ExecutionStatus:ExecutionStatus,CreationTime:CreationTime,Changes:Changes}' \
            --output json > "$change_set_file"
          CHANGE_SET_FILE="$change_set_file" node <<'NODE'
          const fs = require('node:fs');
          const changeSet = JSON.parse(fs.readFileSync(process.env.CHANGE_SET_FILE, 'utf8'));
          if (changeSet.Status !== 'CREATE_COMPLETE') throw new Error('Pilot change set is not complete');
          if (changeSet.ExecutionStatus !== 'AVAILABLE') throw new Error('Pilot change set is not available');
          const counts = {};
          for (const change of changeSet.Changes ?? []) {
            const action = change.ResourceChange?.Action ?? 'Unknown';
            counts[action] = (counts[action] ?? 0) + 1;
          }
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `- Execution status: \`${changeSet.ExecutionStatus}\`\n` +
              `- Resource changes: \`${JSON.stringify(counts)}\`\n`,
          );
          NODE
          cat "$change_set_file"
      - name: Verify exact reviewed pilot change set
        if: inputs.operation == 'deploy' && inputs.confirm_reviewed_diff == true
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
        run: |
          change_set_file="$RUNNER_TEMP/pilot-change-set-for-deploy.json"
          aws cloudformation describe-change-set \
            --stack-name StayPilotStack \
            --change-set-name "$PILOT_CHANGE_SET_NAME" \
            --output json > "$change_set_file"
          CHANGE_SET_FILE="$change_set_file" node <<'NODE'
          const fs = require('node:fs');
          const changeSet = JSON.parse(fs.readFileSync(process.env.CHANGE_SET_FILE, 'utf8'));
          if (changeSet.Status !== 'CREATE_COMPLETE') throw new Error('Reviewed pilot change set is not complete');
          if (changeSet.ExecutionStatus !== 'AVAILABLE') throw new Error('Reviewed pilot change set is not available');
          const parameters = Object.fromEntries(
            (changeSet.Parameters ?? []).map(({ ParameterKey, ParameterValue }) => [ParameterKey, ParameterValue]),
          );
          const expected = {
            ExistingHostedZoneId: process.env.HOSTED_ZONE_ID,
            AlertEmail: process.env.ALERT_EMAIL,
            SesFromEmail: process.env.SES_FROM_EMAIL,
            BedrockModelId: '',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (parameters[key] !== value) throw new Error(`Reviewed pilot parameter mismatch: ${key}`);
          }
          NODE
      - name: Deploy reviewed pilot revision
        if: inputs.operation == 'deploy' && inputs.confirm_reviewed_diff == true
        run: |
          pnpm --filter @stay/infra exec cdk deploy StayPilotStack \
            -c stage=pilot \
            -c enableCloudFront=false \
            -c enableCustomDomain=true \
            -c enableDeletionProtection=true \
            --method execute-change-set \
            --change-set-name "$PILOT_CHANGE_SET_NAME" \
            --require-approval never
      - name: Verify stable protected pilot outputs
        if: inputs.operation == 'deploy' && inputs.confirm_reviewed_diff == true
        run: |
          status="$(aws cloudformation describe-stacks --stack-name StayPilotStack \
            --query 'Stacks[0].StackStatus' --output text)"
          protection="$(aws cloudformation describe-stacks --stack-name StayPilotStack \
            --query 'Stacks[0].EnableTerminationProtection' --output text)"
          test "$protection" = 'True'
          test "$status" = 'CREATE_COMPLETE' -o "$status" = 'UPDATE_COMPLETE'
          for key in Stage ApiUrl McpUrl WebSocketUrl UserPoolId ProductTableName CognitoIssuerUrl ManagedLoginUrl PilotOperatorPolicyArn; do
            value="$(aws cloudformation describe-stacks --stack-name StayPilotStack \
              --query "Stacks[0].Outputs[?OutputKey=='$key'].OutputValue | [0]" --output text)"
            test -n "$value"
            printf '%s=%s\n' "$key" "$value"
          done
