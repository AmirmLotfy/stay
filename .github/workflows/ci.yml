name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
      - name: Activate pinned pnpm
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stay/contracts generate:openapi
      - run: git diff --exit-code -- docs/openapi.json packages/contracts/src/generated-api.d.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:coverage
      - name: Install media verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: pnpm verify:submission:local
      - run: pnpm build
      - run: pnpm cdk:synth
      - name: Synthesize isolated pilot with strict infrastructure checks
        run: pnpm cdk:synth:pilot
      - run: pnpm --filter @stay/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
