name: Deploy reviewed demo

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Generate the exact AWS diff first; deploy only in a later reviewed run
        required: true
        default: diff
        type: choice
        options:
          - diff
          - deploy
      confirm_reviewed_diff:
        description: Confirm the exact target, cost settings, and preceding diff were reviewed
        required: true
        default: false
        type: boolean
      bedrock_model_id:
        description: Exact live-verified us-east-1 Nova model or inference profile ID
        required: false
        type: string
      enable_custom_domain:
        description: Enable saystay.site only after its registrar nameservers match the stack output
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_APP_URL: ${{ inputs.enable_custom_domain && 'https://saystay.site' || 'https://s9y6tc7mfc.execute-api.us-east-1.amazonaws.com' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Confirm target identity
        run: aws sts get-caller-identity
      - name: Require reviewed diff for deployment
        if: inputs.operation == 'deploy' && inputs.confirm_reviewed_diff != true
        run: |
          echo 'Deployment requires confirm_reviewed_diff=true after reviewing a prior diff run.'
          exit 1
      - name: Validate protected deployment parameters
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
          SES_RECIPIENT_EMAIL: ${{ secrets.SES_RECIPIENT_EMAIL }}
        run: |
          test -n "$ALERT_EMAIL"
          test -n "$SES_FROM_EMAIL"
          test -n "$SES_RECIPIENT_EMAIL"
      - name: Generate exact stack diff
        if: inputs.operation == 'diff'
        run: >-
          pnpm --filter @stay/infra diff --
          -c enableCloudFront=false
          -c enableDeletionProtection=true
          -c enableCustomDomain=${{ inputs.enable_custom_domain }}
      - name: Deploy reviewed stack
        if: inputs.operation == 'deploy' && inputs.confirm_reviewed_diff == true
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
          SES_RECIPIENT_EMAIL: ${{ secrets.SES_RECIPIENT_EMAIL }}
          BEDROCK_MODEL_ID: ${{ inputs.bedrock_model_id }}
        run: |
          pnpm --filter @stay/infra deploy -- \
            -c enableCloudFront=false \
            -c enableDeletionProtection=true \
            -c enableCustomDomain=${{ inputs.enable_custom_domain }} \
            --parameters "StayDemoStack:AlertEmail=$ALERT_EMAIL" \
            --parameters "StayDemoStack:SesFromEmail=$SES_FROM_EMAIL" \
            --parameters "StayDemoStack:SesRecipientEmail=$SES_RECIPIENT_EMAIL" \
            --parameters "StayDemoStack:BedrockModelId=$BEDROCK_MODEL_ID" \
            --require-approval never
      - name: Enforce and verify stack termination protection
        if: inputs.operation == 'deploy' && inputs.confirm_reviewed_diff == true
        run: |
          aws cloudformation update-termination-protection \
            --stack-name StayDemoStack \
            --enable-termination-protection
          test "$(aws cloudformation describe-stacks \
            --stack-name StayDemoStack \
            --query 'Stacks[0].EnableTerminationProtection' \
            --output text)" = "True"
